# Note: this workflow is sourced from https://github.com/fluxcd/flux2/blob/main/.github/workflows/e2e.yaml
# and modified to fit this repos structure.

name: e2e

on:
  workflow_dispatch:
  # push:
  #   branches: [ '*' ]
  #   tags-ignore: [ '*' ]

permissions:
  contents: read

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Flux
        # SECURITY WARNING: This action uses @main which is mutable
        # TODO: Pin to specific release tag once available
        uses: fluxcd/flux2/action@main
      - name: Setup Kubernetes
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: flux
      - name: Install Flux in Kubernetes Kind
        run: flux install
      - name: Setup cluster reconciliation
        run: |
          flux create source git flux-system \
          --url=${{ github.event.repository.html_url }} \
          --branch=${GITHUB_REF#refs/heads/} \
          --username=${GITHUB_ACTOR} \
          --password=${{ secrets.GITHUB_TOKEN }} \
          --ignore-paths="clusters/**/flux-system/"
          flux create kustomization flux-system \
          --source=flux-system \
          --path=./clusters/dev
      - name: List files
        run: tree .
      - name: Verify cluster reconciliation
        run: |
          kubectl -n flux-system wait kustomization/flux-system --for=condition=ready --timeout=5m
          kubectl -n flux-system wait kustomization/apps-dev --for=condition=ready --timeout=5m
      - name: Verify helm reconciliation
        run: |
          kubectl -n flux-system wait helmrelease/podinfo --for=condition=ready --timeout=5m
      - name: Debug failure
        if: failure()
        run: |
          kubectl -n flux-system get all
          kubectl -n flux-system logs deploy/source-controller
          kubectl -n flux-system logs deploy/kustomize-controller
          kubectl -n flux-system logs deploy/helm-controller
          flux get all --all-namespaces
